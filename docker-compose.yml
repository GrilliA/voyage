services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: voyage
      POSTGRES_DB: voyage
    ports:
      - "5433:5432"
    volumes:
      - voyage-postgres:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  voyage-postgres:
